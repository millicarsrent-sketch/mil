<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a2a1e">
  <title>Отчёты | Millicars</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <script defer src="../../js/supabase-env.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="../../js/supabase-client.js"></script>
  <script defer src="../../js/admin-reports.js"></script>
</head>
<body class="admin-body">
  <header class="admin-header">
    <a class="admin-brand" href="/">Milli<span>cars</span></a>
    <div class="admin-header-actions">
      <span id="admin-email" class="admin-email"></span>
      <button id="signout-button" class="admin-secondary" type="button">Выйти</button>
    </div>
  </header>
  <main class="admin-main">
    <div class="admin-title-row">
      <div><p class="admin-eyebrow">Millicars / Управление</p><h1>Заявки</h1></div>
      <button id="export-button" class="admin-secondary" type="button">Экспорт CSV</button>
    </div>
    <p id="report-message" class="admin-message" role="status"></p>
    <section class="admin-section" aria-labelledby="bookings-heading">
      <div class="admin-section-head"><h2 id="bookings-heading">Бронирования</h2><span id="booking-count" class="admin-count"></span></div>
      <div class="admin-filters">
        <label>Статус
          <select id="status-filter">
            <option value="all">Все</option><option value="new">Новая</option>
            <option value="confirmed">Подтверждена</option><option value="completed">Завершена</option>
            <option value="cancelled">Отменена</option>
          </select>
        </label>
        <label>Начало аренды от<input id="date-from-filter" type="date"></label>
        <label>Начало аренды до<input id="date-to-filter" type="date"></label>
        <button id="clear-filters" class="admin-text-button" type="button">Сбросить</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Создана</th><th>Клиент</th><th>Телефон</th><th>Автомобиль</th><th>Аренда</th><th>Тип подачи</th><th>Сумма</th><th>Статус</th><th>Заметки</th></tr></thead>
          <tbody id="booking-rows"><tr><td colspan="9">Загружаем заявки…</td></tr></tbody>
        </table>
      </div>
    </section>
    <section class="admin-section" aria-labelledby="cars-heading">
      <div class="admin-section-head"><h2 id="cars-heading">Автопарк</h2><span id="car-count" class="admin-count"></span></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Автомобиль</th><th>Номер</th><th>Цена / день</th><th>Статус</th></tr></thead>
          <tbody id="car-rows"><tr><td colspan="4">Загружаем автопарк…</td></tr></tbody>
        </table>
      </div>
    </section>
    <details class="admin-section admin-password">
      <summary>Изменить пароль</summary>
      <form id="password-form" class="admin-password-form">
        <label for="new-password">Новый пароль</label>
        <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
        <button class="admin-primary" type="submit">Сохранить пароль</button>
      </form>
      <p id="password-message" class="admin-message" role="status"></p>
    </details>
  </main>
</body>
</html>
